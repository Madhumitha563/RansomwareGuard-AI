{% extends "base.html" %}
{% block content %}

<div class="space-y-6">

<h1 class="text-3xl font-bold">
Live Threat Monitoring
</h1>

<p class="text-gray-400">
Real-time detected threats and alerts
</p>

<div class="bg-gray-900 p-6 rounded-xl">

<table class="w-full">

<thead>

<tr class="border-b border-gray-700">

<th class="p-3">Time</th>
<th class="p-3">Level</th>
<th class="p-3">Message</th>

</tr>

</thead>

<tbody id="threatTable">

{% for log in logs %}

<tr class="border-b border-gray-700">

<td class="p-3">
{{ log.timestamp }}
</td>

<td class="p-3 text-red-400">
{{ log.level }}
</td>

<td class="p-3">
{{ log.message }}
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

<script>

const socket = io()

socket.on("connect", () => {

console.log("Connected to threat monitor")

})

socket.on("threat_update", data => {

console.log("New threat:", data)

addThreat(data)

})

function addThreat(data) {

const table =
document.getElementById(
"threatTable"
)

const row =
document.createElement("tr")

row.classList.add(
"border-b",
"border-gray-700"
)

row.innerHTML = `

<td class="p-3">
${data.timestamp}
</td>

<td class="p-3 text-red-400">
${data.level}
</td>

<td class="p-3">
${data.message}
</td>

`

table.prepend(row)

}

</script>

{% endblock %}
