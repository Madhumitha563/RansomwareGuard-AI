{% extends "base.html" %}
{% block content %}

<div class="space-y-6">

<!-- HEADER -->

<div class="flex justify-between items-center">

<div>

<h1 class="text-3xl font-bold">
Alerts Center
</h1>

<p class="text-gray-400">
Real-time security alerts and incident notifications
</p>

</div>

<div class="flex gap-3">

<button
onclick="clearAlerts()"
class="bg-red-600 px-4 py-2 rounded-lg hover:bg-red-700">

Clear Alerts

</button>

</div>

</div>

<!-- ALERT COUNTERS -->

<div class="grid grid-cols-1 md:grid-cols-3 gap-6">

<div class="bg-gray-900 p-6 rounded-xl">

<p class="text-gray-400">
Total Alerts
</p>

<h2
id="totalAlerts"
class="text-4xl text-white mt-2">

0

</h2>

</div>

<div class="bg-gray-900 p-6 rounded-xl">

<p class="text-gray-400">
Critical Alerts
</p>

<h2
id="criticalAlerts"
class="text-4xl text-red-500 mt-2">

0

</h2>

</div>

<div class="bg-gray-900 p-6 rounded-xl">

<p class="text-gray-400">
Resolved Alerts
</p>

<h2
id="resolvedAlerts"
class="text-4xl text-green-400 mt-2">

0

</h2>

</div>

</div>

<!-- ALERT LIST -->

<div class="bg-gray-900 p-6 rounded-xl">

<h3 class="text-xl mb-4">
Live Alerts
</h3>

<div
id="alertFeed"
class="space-y-3 max-h-96 overflow-y-auto">

<p class="text-gray-400">
No alerts yet
</p>

</div>

</div>

</div>

<!-- ALERT SOUND -->

<audio id="alertSound">
<source src="/static/alert.mp3" type="audio/mpeg">
</audio>

<script>

const socket = io()

let total = 0
let critical = 0
let resolved = 0

socket.on("live_update", data => {

addAlert(data)

})

function addAlert(data) {

total++

let severity = "Low"
let color = "bg-green-600"

if (data.risk_score > 70) {

severity = "Critical"
color = "bg-red-600"

critical++

playSound()

}
else if (data.risk_score > 40) {

severity = "Medium"
color = "bg-yellow-600"

}

updateCounters()

const container =
document.getElementById(
"alertFeed"
)

const div =
document.createElement("div")

div.className =
"p-4 rounded-lg flex justify-between items-center " +
color

div.innerHTML = `

<div>

<p class="font-semibold">

${data.alert}

</p>

<p class="text-sm">

${data.timestamp}

</p>

</div>

<button
onclick="resolveAlert(this)"
class="bg-black px-3 py-1 rounded">

Resolve

</button>

`

container.prepend(div)

}

function resolveAlert(button) {

button.parentElement.remove()

resolved++

updateCounters()

}

function clearAlerts() {

document.getElementById(
"alertFeed"
).innerHTML = ""

total = 0
critical = 0
resolved = 0

updateCounters()

}

function updateCounters() {

document.getElementById(
"totalAlerts"
).innerText =
total

document.getElementById(
"criticalAlerts"
).innerText =
critical

document.getElementById(
"resolvedAlerts"
).innerText =
resolved

}

function playSound() {

document
.getElementById("alertSound")
.play()

}

</script>

{% endblock %}
