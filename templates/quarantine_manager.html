{% extends "base.html" %}
{% block content %}

<div class="p-6 space-y-6">

<h1 class="text-3xl font-bold">
Quarantine Manager
</h1>

<button
onclick="clearQuarantine()"
class="bg-red-600 px-4 py-2 rounded-lg hover:bg-red-700">

Clear All

</button>

<div class="bg-gray-900 p-6 rounded-xl">

<table class="w-full text-left">

<thead>

<tr class="border-b border-gray-700">

<th class="p-3">Time</th>
<th class="p-3">File Name</th>
<th class="p-3">Original Path</th>
<th class="p-3">Threat</th>
<th class="p-3">Action</th>

</tr>

</thead>

<tbody id="quarantineTable">

{% for file in files %}

<tr class="border-b border-gray-700">

<td class="p-3">
{{ file.quarantined_at }}
</td>

<td class="p-3">
{{ file.filename }}
</td>

<td class="p-3">
{{ file.original_path }}
</td>

<td class="p-3 text-red-500">
{{ file.threat_type }}
</td>

<td class="p-3">

<button
onclick="restoreFile({{ file.id }})"
class="bg-green-600 px-3 py-1 rounded mr-2">

Restore

</button>

<button
onclick="deleteFile({{ file.id }})"
class="bg-red-600 px-3 py-1 rounded">

Delete

</button>

</td>

</tr>

{% else %}

<tr>
<td colspan="5">
No files quarantined
</td>
</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

<script>

function deleteFile(id) {

fetch("/delete-quarantine/" + id,
{
method: "POST"
})
.then(res => res.json())
.then(data => {

alert(data.message)
location.reload()

})

}

function restoreFile(id) {

fetch("/restore-quarantine/" + id,
{
method: "POST"
})
.then(res => res.json())
.then(data => {

alert(data.message)
location.reload()

})

}

function clearQuarantine() {

fetch("/clear-quarantine",
{
method: "POST"
})
.then(res => res.json())
.then(data => {

alert(data.message)
location.reload()

})

}

</script>

{% endblock %}
